# dsh-background-by-model: dev patch overlay for the web profile.
#
# Usage:
#   pnpm dsh web --patch ./cordis.yml
#
# This inserts the plugin into the web composition. The plugin registers a
# "Theme" settings section with a custom color wheel, background wallpaper,
# and opacity/blur controls.

- insert:
    - id: dsh-background-by-model
      name: 'dsh-background-by-model'
# The RPC transport (see src/rpc-host.ts): the child row that owns the host's
# `connection` service. Without it no RPC answers.
- insert:
    - id: dsh-background-by-model-rpc
      name: 'dsh-background-by-model/rpc-host'
