# Deep Midnight theme plugin: bundle patch layer.
# When this package is installed into a profile via `dsh plugin add`,
# this patch is applied as a layer, inserting the theme plugin row
# into the composed configuration.

- insert:
    - id: dsh-background-by-model
      name: 'dsh-background-by-model'
# The RPC transport is its own plugin: it is the only piece that reads the host's
# `connection` / `webServer`, and a nested `ctx.inject` from inside `apply` does
# not inherit them (see src/rpc-host.ts).
- insert:
    - id: dsh-background-by-model-rpc
      name: 'dsh-background-by-model/rpc-host'
