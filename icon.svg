<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Drawn 1.2x about the artwork's own centre, so the mark fills the container
       the way the other plugin icons do. The bbox before scaling is
       x 5.50..30.70, y 3.75..31.95; 1.277 is the largest factor the viewBox
       allows vertically, so this keeps headroom instead of touching the edge. -->
  <g transform="translate(-3.720 -3.420) scale(1.2)">
    <defs>
    <linearGradient id="j1" x1="8" y1="12" x2="28.5" y2="32" gradientUnits="userSpaceOnUse">
    <stop stop-color="#69B9FF"/><stop offset="1" stop-color="#324DE2"/>
    </linearGradient>
    <clipPath id="jclip"><rect x="8.5" y="12" width="20" height="20" rx="5"/></clipPath>
    </defs>
    <rect x="11" y="4.5" width="19" height="19" rx="4.5" transform="rotate(9 20.5 14)" fill="#4561EE" opacity=".3"/>
    <rect x="6" y="9" width="19" height="19" rx="4.5" transform="rotate(-6 15.5 18.5)" fill="#4561EE" opacity=".55"/>
    <rect x="8.5" y="12" width="20" height="20" rx="5" fill="url(#j1)"/>
    <g clip-path="url(#jclip)">
    <circle cx="15.4" cy="17.8" r="2.1" fill="#fff" opacity=".95"/>
    <path d="M11.6 27.6l4.7-4.7 3.1 3.3 2.1-1.9 4.3 4.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
    </g>
  </g>
</svg>
